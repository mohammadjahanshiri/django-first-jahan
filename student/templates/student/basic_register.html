<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #2575fc, #6a11cb);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-box {
      background: #fff;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    h2 {
      margin-bottom: 25px;
      color: #333;
      font-weight: 600;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: right;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #2575fc;
    }

    button {
      width: 100%;
      background: #2575fc;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #1f63d6;
    }

    .note {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #555;
    }

    .note a {
      color: #2575fc;
      text-decoration: none;
      font-weight: 600;
    }

    .note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="form-box">
    <h2>ثبت‌نام</h2>
    <form method="post" action="">
      <!-- در جنگو یادت نره -->
      <!-- {% csrf_token %} -->
      <div class="input-group">
        <label for="username">نام کاربری</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="input-group">
        <label for="password">رمز عبور</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">ثبت‌نام</button>
    </form>
    <div class="note">
      حساب داری؟ <a href="{% url 'login' %}">ورود</a>
    </div>
  </div>

</body>
</html>
